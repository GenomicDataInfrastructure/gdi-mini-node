[project]
name = "gdi-mini-node"
version = "0.9.1"
description = "GDI dataset services (FAIR Data Point v1.2, GA4GH Beacon v2)"
readme = "README.md"
license = "Unlicense"
license-files = [ "LICENSE" ]
authors = [
    { name = "Erik Jaaniso", email = "erik.jaaniso@ut.ee" },
    { name = "Martti Tamm", email = "martti.tamm@ut.ee" }
]

requires-python = ">=3.14,<4"

dependencies = [
    "argparse (>=1.4.0,<2.0.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "cyvcf2 (>=0.34.0,<0.35.0)",
    "fastapi [standard] (>=0.162.0,<1.0)",
    "isoduration (>=20.11.0,<21.0.0)",
    "iterators (>=0.2.0,<0.3.0)",
    "minio (>=7.2.20,<8.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pyshacl (>=0.40.2,<0.41.0)",
    "python-json-logger (>=4.2.0,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "rdflib (>=7.6.0,<8.0.0)",
    "watchdog (>=7.0.0,<8.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = ">=26.10.1,<27.0.0"
poetry-core = ">=2.5.0,<3.0.0"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
